[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auto-sme"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "jinja2>=3.1",
    "weasyprint>=62",
    "fpdf2>=2.7",
    "openai>=1.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.0",
]
legacy-api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "twilio>=9.0",
]

[project.scripts]
auto-sme = "auto_sme.cli:app"

[tool.ruff]
select = ["E", "F", "W"]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
